<circle cx="160" cy="150" r="22.0" fill="url(#r5)"/><path d="M153.0 141.0 L160 135.0 L167.0 141.0 Z" fill="#4e4a52"/><rect x="154.0" y="141.0" width="12.0" height="17.0" rx="2.0" fill="#ffd98a" stroke="#4e4a52" stroke-width="2.0"/><line x1="160" y1="141.0" x2="160" y2="158.0" stroke="#4e4a52" stroke-width="1.2"/><rect x="153.0" y="158.0" width="14.0" height="3.0" fill="#4e4a52"/>
</g></g>
