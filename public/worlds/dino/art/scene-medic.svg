<rect x="236" y="172" width="48" height="32" rx="3" fill="url(#g4)" stroke="#8aa3b0" stroke-width="1.2"/><rect x="252.8" y="168" width="14.399999999999999" height="5" rx="2" fill="#8aa3b0"/><path d="M260.0 199.07692307692307 Q248.92307692307693 188.0 260.0 176.92307692307693 Q271.0769230769231 188.0 260.0 199.07692307692307 Z" fill="#3f7330"/><line x1="260.0" y1="179.3846153846154" x2="260.0" y2="199.07692307692307" stroke="#fff" stroke-width="1.353846153846154" opacity="0.75"/>
