<rect x="0" y="0" width="364" height="250" fill="url(#g1)"/>
<rect x="178" y="0" width="9" height="252" fill="#9a6a42"/>
<rect x="0" y="248" width="364" height="92" fill="url(#g2)"/>
<ellipse cx="182" cy="300" rx="150" ry="28" fill="#cfe6d6"/><ellipse cx="182" cy="300" rx="124" ry="20" fill="none" stroke="#5c9b3d" stroke-width="3"/>
