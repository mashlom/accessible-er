<linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbf8f0"/><stop offset="0.5" stop-color="#fbf7ee"/><stop offset="1" stop-color="#b0ada7"/></linearGradient></defs>
