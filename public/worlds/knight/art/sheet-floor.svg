<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 340" width="364" height="340">
<!-- Knight world: the panel behind a picture on its sheet -->
<defs><filter id="paint" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="noise"/>
<feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
<feComposite in="wobbly" in2="grey" operator="arithmetic" k1="0" k2="1" k3="0.13" k4="-0.065" result="grained"/>
<feComposite in="grained" in2="wobbly" operator="in"/>
</filter>
<filter id="clay" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceGraphic" stdDeviation="1.2" edgeMode="duplicate" result="blur"/>
<feColorMatrix in="blur" type="luminanceToAlpha" result="lum"/>
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="ablur"/>
<feComposite in="lum" in2="ablur" operator="arithmetic" k2="0.6" k3="0.6" result="height"/>
<feSpecularLighting in="height" surfaceScale="3" specularConstant="0.5" specularExponent="16" lighting-color="#fff8ec" result="spec"><feDistantLight azimuth="235" elevation="38"/></feSpecularLighting>
<feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
<feDiffuseLighting in="height" surfaceScale="3" diffuseConstant="1.3" lighting-color="#fff" result="diff"><feDistantLight azimuth="235" elevation="50"/></feDiffuseLighting>
<feBlend in="SourceGraphic" in2="diff" mode="multiply" result="lit"/>
<feComposite in="lit" in2="SourceAlpha" operator="in" result="litIn"/>
<feComposite in="litIn" in2="specIn" operator="arithmetic" k2="1" k3="0.5"/>
</filter>
<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fb"/><stop offset="0.55" stop-color="#f4efe2"/><stop offset="1" stop-color="#e3d6b8"/></linearGradient></defs>
<g><g filter="url(#paint)">
<rect width="364" height="340" fill="url(#g1)"/>
<path d="M0 219 Q23 222 46 220 Q68 224 91 214 Q114 218 136 209 Q159 213 182 213 Q205 216 228 220 Q250 223 273 220 Q296 223 318 213 Q341 216 364 209 L364 340 L0 340 Z" fill="#c9dcb0"/>
<path d="M0 259 Q23 262 46 254 Q68 257 91 250 Q114 253 136 254 Q159 257 182 259 Q205 262 228 259 Q250 262 273 253 Q296 256 318 250 Q341 253 364 255 L364 340 L0 340 Z" fill="#b5d197"/>
<g opacity="0.95"><ellipse cx="70" cy="63.2" rx="30.400000000000002" ry="7.2" fill="#dfe9f3"/><ellipse cx="70" cy="60" rx="27.200000000000003" ry="9.600000000000001" fill="#fff"/><circle cx="59.6" cy="53.6" r="10.4" fill="#fff"/><circle cx="78.0" cy="50.4" r="12.8" fill="#fff"/><circle cx="74.8" cy="47.2" r="6.4" fill="#fff"/></g>
<g opacity="0.95"><ellipse cx="290" cy="42.4" rx="22.8" ry="5.3999999999999995" fill="#dfe9f3"/><ellipse cx="290" cy="40" rx="20.4" ry="7.199999999999999" fill="#fff"/><circle cx="282.2" cy="35.2" r="7.8" fill="#fff"/><circle cx="296.0" cy="32.8" r="9.6" fill="#fff"/><circle cx="293.6" cy="30.4" r="4.8" fill="#fff"/></g>
</g></g>
</svg>
