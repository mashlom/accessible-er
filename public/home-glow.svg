<svg xmlns="http://www.w3.org/2000/svg" width="812" height="1340" viewBox="-200 -200 812 1340">
  <!-- the home's background glows, after the design (Figma "Mashlom.me", מסך בית), in the mockup's 412-wide units;
       the canvas has 200 units of room on every side so the blur is never cut off. The circles are a little
       larger than in the mockup so they show around the white card. -->
  <defs>
    <filter id="a" x="-200" y="-200" width="812" height="1340" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="b" x="-200" y="-200" width="812" height="1340" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <circle cx="236" cy="340" r="95" fill="#B3A9DB" fill-opacity="0.75" filter="url(#a)"/>
  <circle cx="370" cy="420" r="130" fill="#F6D5B6" fill-opacity="0.6" filter="url(#a)"/>
  <circle cx="9.5" cy="774.5" r="109.5" fill="#F6D5B6" fill-opacity="0.2" filter="url(#b)"/>
</svg>
